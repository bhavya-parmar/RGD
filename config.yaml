# ==============================================================================
# RGD: Research Gap Discovery Configuration
# ==============================================================================

project:
  name: "Research Gap Discovery"
  version: "0.1.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  embeddings_dir: "models/embeddings"
  faiss_indices_dir: "models/faiss_indices"
  reports_dir: "reports"

# Phase 1: Literature Retrieval & Acquisition
acquisition:
  default_query: "physics informed neural networks"
  max_seed_papers: 50
  citation_expansion_depth: 1
  max_references_per_paper: 20
  openalex_base_url: "https://api.openalex.org"
  request_timeout_sec: 15
  rate_limit_pause_sec: 0.1

deduplication:
  jaccard_threshold: 0.8 # exact Jaccard needed to call two papers duplicates
  lsh_threshold: 0.65 # LSH candidate cutoff, kept below jaccard_threshold so duplicates are rarely missed
  num_perm: 128
  shingle_size: 3
  fields_to_check:
    - "title"
    - "abstract"

# Phase 2: Semantic & Citation Representation
representation:
  specter:
    model_name: "allenai/specter2_base"
    adapter_name: "allenai/specter2" # proximity adapter (similarity/clustering); null = base model only
    batch_size: 16
    max_token_length: 512
    device: "auto" # "cuda", "cpu", or "auto"
  pca:
    enabled: true
    n_components: 64
    random_state: 42
  faiss:
    dimension: 64 # Matches PCA output or SPECTER (768) if PCA disabled
    metric: "inner_product" # Cosine similarity after L2 normalization
    index_type: "IndexFlatIP" # or "IndexIVFFlat" for larger corpora
    top_k_neighbors: 10
  citation_graph:
    directed: true

# Phase 3: Community & Frontier Detection
detection:
  semantic_clustering:
    init: "k-means++"
    n_clusters: 8
    max_iter: 300
    random_state: 42
  graph_clustering: # Louvain; number of communities is chosen automatically
    resolution: 1.0 # > 1: more, smaller communities; < 1: fewer, larger ones
    random_state: 42
  frontier_scoring:
    community_col: "citation_community" # citation silos (Louvain); "semantic_community" compares k-means topic clusters
    similarity_percentile: 95 # "highly similar" = top 5% of similarities (adapts to the embedding space)
    max_density_ratio: 1.0 # "low citation" = pair density <= this x whole-graph density
    min_community_size: 3
    top_k_frontiers: 10

# Phase 4: Validation & Analysis
validation:
  similarity_ci: # bootstrap confidence interval of each frontier's mean similarity
    n_iterations: 500
    subsample_ratio: 0.80
    confidence: 0.95
    random_state: 42
  hypothesis_test: # permutation test of the citation gap
    n_permutations: 100
    alpha: 0.05
